<h2>Source URLs</h2>

<h3>M3U Playlist Sources (Prioritized)</h3>
<table id="m3u-url-table">
	<thead>
		<tr>
			<th class="column-priority">Priority</th>
			<th class="column-name">Name</th>
			<th class="column-url">URL</th>
			<th class="column-actions">Actions</th>
		</tr>
	</thead>
	<tbody id="m3u-url-list">
		{0}
	</tbody>
</table>
<button type="button" onclick="addM3uUrlRow()">Add M3U Source</button>
<button type="button" onclick="refreshAllM3u()" title="Refresh all M3U sources">↻ Refresh All M3U</button>
<br /><br />

<h3>EPG Source URLs (Prioritized)</h3>
<table id="epg-url-table">
	<thead>
		<tr>
			<th class="column-priority">Priority</th>
			<th class="column-offset">Offset</th>
			<th class="column-name">Name</th>
			<th class="column-url">URL</th>
			<th class="column-actions">Actions</th>
		</tr>
	</thead>
	<tbody id="epg-url-list">
		{1}
	</tbody>
</table>
<button type="button" onclick="addEpgUrlRow()">Add URL</button><br />
<button type="button" onclick="refreshAllEpg()" title="Download and cache all EPG files">↻ Refresh All EPG</button>
<br /><br />
